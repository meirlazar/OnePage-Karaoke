<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnePage Karaoke</title>
    <style>
      :root {
        --bg-base: #0b0c10;
        --bg-surface: #1f2833;
        --bg-panel: #161f28;
        --border: #45f3ff33;
        --text-main: #c5c6c7;
        --text-muted: #8fa7b2;
        --accent: #45f3ff;
        --accent-hover: #66fcf1;
        --success: #7dffb3;
        --warning: #ffcf66;
        --danger: #ff8a80;
        --label-color: #66fcf1;
        --control-bg: #111821;
        --control-fg: #ffffff;
        --control-border: #45f3ff66;
        --button-bg: #45f3ff;
        --button-fg: #0b0c10;
        --button-hover-bg: #66fcf1;
        --button-small-fg: #c5c6c7;
        --radius: 6px;
      }
      body {
        font-family: "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 20px;
        background: var(--bg-base);
        color: var(--text-main);
        line-height: 1.5;
      }
      h1, h2, h3, h4 { color: var(--accent-hover); margin-top: 0; }
      .app-layout {
        display: grid;
        grid-template-columns: minmax(280px, 400px) minmax(0, 1fr);
        gap: 20px;
        max-width: 1900px;
        margin: 0 auto;
        align-items: start;
      }
      .right-column { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
      .top-panels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
      .top-panels .card { margin-bottom: 0; min-height: 0; }
      .card {
        background: var(--bg-surface);
        padding: 16px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        margin-bottom: 16px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        resize: vertical;
        overflow: auto;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        min-width: 0;
        min-height: 120px;
        align-self: start;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        font-weight: 600;
        font-size: 15px;
        color: var(--label-color);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
            /* Target your progress bar specifically */
      #progressBar {
          -webkit-appearance: none;
          appearance: none;
          width: 100%;
          margin: 0;
          padding: 0; /* This removes the gap */
          background: transparent;
      }

      /* Optional: Make the track look clean so it aligns perfectly */
      #progressBar::-webkit-slider-runnable-track {
          width: 100%;
          height: 4px;
          background: var(--bg-surface); /* or whatever color you use */
          border-radius: 2px;
      }

            /* 1. Strip default browser styling to remove the gap */
      #seekBar {
          -webkit-appearance: none;
          appearance: none;
          margin: 0;
          padding: 0;
          background: transparent; /* Hides default background */
      }

      /* 2. Style the "Track" (the line itself) so it spans 100% edge-to-edge */
      #seekBar::-webkit-slider-runnable-track {
          width: 100%;
          height: 6px;
          background: var(--border); /* Uses your existing CSS variable */
          border-radius: 3px;
          cursor: pointer;
      }

      /* 3. Style the "Thumb" (the circle you drag) */
      #seekBar::-webkit-slider-thumb {
          -webkit-appearance: none;
          appearance: none;
          height: 16px;
          width: 16px;
          background: var(--accent); /* Uses your existing CSS variable */
          border-radius: 50%;
          cursor: pointer;
          margin-top: -5px; /* Pulls the thumb up so it centers on the line */
      }

      /* Fix for Firefox */
      #seekBar::-moz-range-track {
          width: 100%;
          height: 6px;
          background: var(--border);
          border-radius: 3px;
      }
      #seekBar::-moz-range-thumb {
          height: 16px;
          width: 16px;
          background: var(--accent);
          border-radius: 50%;
          border: none;
      }
        .vocal-waveform-rail {
          position: relative;
          height: 54px;
          margin: 6px 0 0;
          padding: 5px 8px;
          background: #ffffff;
          border: 1px solid #0b0c10;
          border-radius: 4px 4px 0 0;
          box-sizing: border-box;
          cursor: pointer;
        }
        #vocalWaveform {
          display: block;
          width: 100%;
          height: 100%;
        }
           .vocal-waveform-tools {
             position: absolute;
             top: 4px;
             right: 6px;
             z-index: 2;
             display: flex;
             gap: 2px;
           }
           .vocal-waveform-tools button {
             width: 22px;
             height: 20px;
             padding: 0;
             border: 1px solid #111111;
             background: #ffffff;
             color: #111111;
             font-size: 14px;
             line-height: 18px;
             cursor: pointer;
           }
           .vocal-waveform-tools button:hover {
             background: #111111;
             color: #ffffff;
           }
      input[type="text"], input[type="number"], input[type="range"], select, textarea {
        width: 100%;
        padding: 8px 10px;
        background: var(--control-bg);
        border: 1px solid var(--control-border);
        border-radius: 4px;
        color: var(--control-fg);
        box-sizing: border-box;
        font-size: 13px;
      }
      input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--control-fg) 65%, transparent); }
      select option { background: var(--control-bg); color: var(--control-fg); }
      input[type="text"]:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--accent);
      }
      textarea {
        height: 180px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        resize: vertical;
      }
      .section-toggle {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: transparent;
        border: none;
        color: inherit;
        padding: 0;
        margin: 0 0 12px;
        cursor: pointer;
        text-align: center;
        position: relative;
      }
      .section-toggle > span:first-child { width: 100%; text-align: center; }
      .section-toggle-main { font-size: 19px; font-weight: 700; color: var(--accent-hover); display: block; text-align: center; }
      .section-toggle-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; display: block; }
      .section-toggle-arrow { font-size: 18px; color: var(--accent); transition: transform 0.2s ease; position: absolute; right: 0; top: 2px; }
      .section-toggle.collapsed .section-toggle-arrow { transform: rotate(-90deg); }
      .section-body.hidden { display: none; }
      .btn {
        background: var(--button-bg);
        color: var(--button-fg);
        border: none;
        padding: 8px 12px;
        font-weight: 700;
        font-size: 13px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn:hover { background: var(--button-hover-bg); box-shadow: 0 0 8px rgba(102, 252, 241, 0.4); }
      .btn-wide { width: 100%; margin-top: 10px; }
      .btn-small { padding: 6px 10px; font-size: 11px; background: transparent; border: 1px solid var(--control-border); color: var(--button-small-fg); }
      .btn-small:hover { background: rgba(69, 243, 255, 0.1); border-color: var(--accent); color: var(--control-fg); }
      .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .pipeline-section { border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 6px; padding: 12px; margin-top: 12px; background: rgba(0, 0, 0, 0.2); }
      .preview-pane {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        resize: vertical;
        max-width: 100%;
        box-sizing: border-box;
        min-width: 0;
        min-height: 440px;
      }
      .preview-header-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; padding: 12px;
        background: linear-gradient(180deg, rgba(11, 12, 16, 0.95) 0%, rgba(11, 12, 16, 0.4) 70%, transparent 100%);
        display: flex; flex-wrap: wrap; gap: 10px; z-index: 10; opacity: 0.15; transition: opacity 0.3s ease;
        align-items: center; justify-content: center; border-radius: var(--radius) var(--radius) 0 0;
      }
      .preview-pane:hover .preview-header-overlay { opacity: 1; }
      .section-toggle { cursor: pointer; }
      .section-toggle:active { cursor: grabbing; }
      .panel-dragging { cursor: grabbing !important; user-select: none; z-index: 50; opacity: 0.92; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55); pointer-events: none; }
      .panel-drop-target { outline: 2px dashed var(--accent); outline-offset: 4px; }
      body.panel-drag-active, body.panel-drag-active * { cursor: grabbing !important; }
      .compact-ctrl { display: flex; align-items: center; gap: 6px; background: rgba(31, 40, 51, 0.8); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); font-size: 11px; }
      .compact-ctrl input[type="color"] { width: 20px; height: 20px; padding: 0; border: none; cursor: pointer; background: transparent; }
      .compact-ctrl select, .compact-ctrl input[type="range"] { background: transparent; border: none; padding: 0; width: 80px; color: var(--control-fg); }
      .step-btn { width: 20px; height: 20px; padding: 0; border: 1px solid var(--control-border); background: transparent; color: var(--control-fg); cursor: pointer; line-height: 16px; }
      .step-btn:hover { background: var(--accent); color: var(--button-fg); }
      .compact-ctrl select:focus { outline: none; }
      .compact-ctrl select option { background-color: var(--control-bg); color: var(--control-fg); }
      #canvas-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
      canvas { width: 100%; height: 100%; display: block; }
      .integrated-timing-rail { background: rgba(11, 12, 16, 0.9); border-top: 1px solid var(--border); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      .media-controls { background: var(--bg-surface); border-top: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      .media-controls input[type="range"] { flex: 1; min-width: 100px; }
      .media-inline-control { display: flex; align-items: center; gap: 8px; }
      .media-inline-control label { margin: 0; }
      .media-inline-control label { font-size: 15px; color: var(--label-color); }
      .media-controls select {
        background: var(--control-bg) !important;
        color: var(--control-fg);
        border: 1px solid var(--control-border);
      }
      .media-controls select option {
        background: var(--control-bg);
        color: var(--control-fg);
      }
      .state-badge { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
      .state-waiting { background: rgba(255, 207, 102, 0.1); color: var(--warning); border: 1px solid rgba(255, 207, 102, 0.2); }
      .state-ready, .state-completed { background: rgba(125, 255, 179, 0.1); color: var(--success); border: 1px solid rgba(125, 255, 179, 0.2); }
      .state-running { background: rgba(69, 243, 255, 0.1); color: var(--accent); border: 1px solid rgba(69, 243, 255, 0.2); }
      .state-failed { background: rgba(255, 138, 128, 0.1); color: var(--danger); border: 1px solid rgba(255, 138, 128, 0.2); }
      .job-list { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
      .job-item { border: 1px solid var(--border); border-radius: 6px; padding: 10px; background: var(--bg-base); }
      .job-top { display: flex; justify-content: space-between; align-items: center; }
      .job-label { font-size: 13px; font-weight: 600; color: #fff; }
      .job-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
      .job-bar { width: 100%; height: 4px; background: var(--bg-surface); border-radius: 2px; overflow: hidden; margin-top: 8px; }
      .job-bar-fill { height: 100%; background: var(--accent); }
      .file-row { display: block; padding: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 12px; }
      .file-row-active {
        border: 1px solid var(--accent-hover);
        border-radius: 6px;
        background: linear-gradient(90deg, rgba(69, 243, 255, 0.14), rgba(125, 255, 179, 0.08));
        box-shadow: 0 0 12px rgba(69, 243, 255, 0.45);
        animation: activeVaultPulse 1.1s ease-in-out infinite alternate;
      }
      .file-row-main { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .file-row-actions { display: flex; gap: 4px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
      .vault-btn { padding: 3px 7px; font-size: 10px; line-height: 1.2; }
      .file-row-active .file-name { color: #fff; font-weight: 700; }
      @keyframes activeVaultPulse {
        from { box-shadow: 0 0 8px rgba(69, 243, 255, 0.25), 0 0 0 rgba(102, 252, 241, 0.1); }
        to { box-shadow: 0 0 18px rgba(102, 252, 241, 0.75), 0 0 10px rgba(125, 255, 179, 0.35); }
      }
      .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .btn[disabled] { opacity: 0.9; cursor: default; pointer-events: none; }
      .manual-word { color: var(--success); font-weight: 700; font-size: 14px; }
      .snapshot-bottom-wrap {
        max-width: 1900px;
        margin: 12px auto 0;
        padding: 0 4px;
      }
      .btn-snapshot-bottom {
        width: 100%;
        padding: 14px 16px;
        font-size: 16px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 800;
      }
      .theme-meta {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 8px;
        min-height: 18px;
      }
      .debug-output {
        margin-top: 10px;
        max-height: 260px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.28);
        padding: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        white-space: pre-wrap;
      }
      .debug-summary {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 8px;
      }
      .debug-actions {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
        margin-top: 10px;
      }
      @media (max-width: 1200px) {
        .app-layout { grid-template-columns: 1fr; }
        .top-panels { grid-template-columns: 1fr; }
        .preview-pane { position: static; min-width: 0; }
        .card { min-width: 0; }
      }
    </style>
</head>
<body>
    <h2 style="text-align: center; margin-bottom: 24px; letter-spacing: -0.5px">OnePage-Karaoke Creator</h2>

    <div class="app-layout">
      <div class="sidebar">
        <div class="card">
          <button type="button" class="section-toggle" onclick="toggleSection('sectionIngestBody', this)">
            <span>
              <span class="section-toggle-main">[1] Get A Song</span>
              <span class="section-toggle-sub">Hardware allocation, file uploads, and URL scraping.</span>
            </span>
            <span class="section-toggle-arrow">▾</span>
          </button>
          <div id="sectionIngestBody" class="section-body">
            <div class="row2">
              <div>
                <label>Whisper Model</label>
                <select id="whisperModel">
                  <option value="small">small</option>
                  <option value="medium" selected>medium</option>
                  <option value="large-v2">large-v2</option>
                  <option value="large-v3">large-v3</option>
                </select>
              </div>
              <div>
                <label>Language</label>
                <select id="transcriptionLanguage">
                  <option value="auto" selected>Auto</option>
                  <option value="en">English</option>
                  <option value="ru">Russian</option>
                  <option value="he">Hebrew</option>
                  <option value="es">Spanish</option>
                </select>
              </div>
            </div>
            <div class="row2" style="margin-top: 8px">
              <div>
                <label>Stem Device</label>
                <select id="stemDevice">
                  <option value="auto" selected>Auto</option>
                  <option value="cuda">GPU / CUDA</option>
                  <option value="cpu">CPU</option>
                </select>
              </div>
              <div>
                <label>Whisper Device</label>
                <select id="whisperDevice">
                  <option value="auto" selected>Auto</option>
                  <option value="cuda">GPU / CUDA</option>
                  <option value="cpu">CPU</option>
                </select>
              </div>
            </div>
            <div class="pipeline-section">
              <label>Local Upload</label>
              <div style="display: flex; gap: 8px">
                <input type="file" id="sourceUpload" accept=".mp3,.mp4,.wav,.m4a,.flac,.webm,video/*,audio/*" style="padding: 4px" />
                <button class="btn" onclick="uploadSourceFile()">Push</button>
              </div>
              <label style="margin-top: 12px">Web Fetch</label>
              <div style="display: flex; gap: 8px">
                <input type="text" id="sourceUrl" placeholder="https://youtube.com/watch?v=..." />
                <button class="btn" onclick="submitSourceUrl()">Pull</button>
              </div>
              <select id="downloadEngine" style="margin-top: 8px;">
                <option value="ytdl">yt-dlp</option>
                <option value="metube">MeTube</option>
              </select>
            </div>
            <div class="row2" style="margin-top: 12px">
              <button class="btn btn-small btn-wide" onclick="autoTranscribe()">Force Transcribe</button>
            </div>
          </div>
        </div>

        <div class="card">
          <button type="button" class="section-toggle" onclick="toggleSection('sectionGrabLyricsBody', this)">
            <span>
              <span class="section-toggle-main">[2] Pull Lyrics</span>
              <span class="section-toggle-sub">Select Lyrics Provider to pull lyrics into the editor.</span>
            </span>
            <span class="section-toggle-arrow">▾</span>
          </button>
          <div id="sectionGrabLyricsBody" class="section-body">
            <label>Lyrics Service</label>
            <select id="lyricsProvider">
              <option value="lrclib" selected>lrclib</option>
              <option value="genius">Genius</option>
            </select>
            <button class="btn btn-small btn-wide" onclick="autoGrabLyrics()">Pull Lyrics</button>
          </div>
        </div>

        <div class="card">
          <button type="button" class="section-toggle" onclick="toggleSection('sectionStatusBody', this)">
            <span><span class="section-toggle-main">[3] Edit Lyrics</span></span>
            <span class="section-toggle-arrow">▾</span>
          </button>
          <div id="sectionStatusBody" class="section-body">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px">
              <span id="activeLyricsLabel" style="font-size: 11px; color: var(--text-muted)">No media mounted</span>
              <span id="lyricsReadyBadge" class="state-badge state-waiting">Not Ready</span>
            </div>
            <textarea id="lyricsEditor" placeholder="[00:12.34] Example lyric line..."></textarea>
            <div class="row2" style="margin-top: 10px;">
              <button class="btn btn-wide" onclick="saveLyricsData()">Save Lyrics & Update Preview</button>
              <button class="btn btn-small btn-wide" onclick="autoCorrectWordTiming('minor')" title="Make small timing adjustments without changing lyric words">Minor Auto-Correct</button>
              <button class="btn btn-small btn-wide" onclick="autoCorrectWordTiming('major')" title="Rebuild timing from the AI alignment">Major Auto-Correct</button>
            </div>
            <div style="display:grid; grid-template-columns: 44px 1fr 44px; gap:8px; margin-top:10px; align-items:center;">
              <button class="btn btn-small" onclick="stepLyricsRevision(-1)" title="Previous lyrics version">◀</button>
              <button class="btn btn-small btn-wide" style="margin-top:0" onclick="revertLyricsRevision()" title="Load this lyrics revision">Load This Revision (Lyrics & Timing)</button>
              <button class="btn btn-small" onclick="stepLyricsRevision(1)" title="Next lyrics version">▶</button>
            </div>
          </div>
        </div>

        <div class="card">
          <button type="button" class="section-toggle" onclick="toggleSection('sectionRenderBody', this)">
            <span>
              <span class="section-toggle-main">[4] Render</span>
              <span class="section-toggle-sub">Preview, export final, or render with chorus vocals restored.</span>
            </span>
            <span class="section-toggle-arrow">▾</span>
          </button>
          <div id="sectionRenderBody" class="section-body">
            <label>Render Hardware</label>
            <select id="renderDevice" style="margin-bottom: 8px">
              <option value="auto">Auto</option>
              <option value="cuda" selected>GPU / NVENC</option>
              <option value="cpu">CPU</option>
            </select>
            <div class="row2">
              <button class="btn btn-small" onclick="startRender('preview')" title="Uses the original vocal audio">Render Preview</button>
              <button class="btn" style="background: var(--success)" onclick="startRender('final')" title="Instrumental audio only">Export Final</button>
            </div>
            <button class="btn btn-small btn-wide" style="margin-top: 10px" onclick="startRender('chorus')" title="Instrumental audio, but the original vocals play during the detected chorus sections">Render with Chorus</button>
            <button class="btn btn-small btn-wide" onclick="saveProjectSnapshot()" style="margin-top: 10px">Save Project Snapshot</button>
            <div id="actionStatus" style="font-size: 11px; color: var(--text-muted); margin-top: 8px; text-align: center"></div>
          </div>
        </div>
      </div>

      <div class="right-column">
      <div class="top-panels">
        <div class="card">
          <button type="button" class="section-toggle" onclick="toggleSection('sectionTopJobsBody', this)">
            <span><span class="section-toggle-main">Active Jobs</span></span>
            <span class="section-toggle-arrow">▾</span>
          </button>
          <div id="sectionTopJobsBody" class="section-body">
            <div id="job-list" class="job-list">No jobs yet.</div>
          </div>
        </div>

        <div class="card">
          <button type="button" class="section-toggle" onclick="toggleSection('sectionThemeDebugBody', this)">
            <span>
              <span class="section-toggle-main">Theme &amp; Debug</span>
              <span class="section-toggle-sub">Switch built-in UI themes and capture exact backend diagnostics.</span>
            </span>
            <span class="section-toggle-arrow">▾</span>
          </button>
          <div id="sectionThemeDebugBody" class="section-body">
            <label>Theme</label>
            <select id="themeSelect" onchange="applySelectedTheme()"></select>
            <div id="themeMeta" class="theme-meta">Loading theme catalog...</div>
            <div class="debug-actions">
              <button class="btn btn-small" onclick="applySelectedTheme()">Apply Theme</button>
              <button class="btn btn-small" onclick="runDebugger()">Run Debugger</button>
              <button class="btn btn-small" onclick="copyDebugReport()">Copy Report</button>
            </div>
            <div id="debugSummary" class="debug-summary">Debugger idle.</div>
            <div id="debugOutput" class="debug-output">No diagnostics captured yet.</div>
          </div>
        </div>

        <div class="card">
          <button type="button" class="section-toggle" onclick="toggleSection('sectionLibraryBody', this)">
            <span><span class="section-toggle-main">Media Vault</span></span>
            <span class="section-toggle-arrow">▾</span>
          </button>
          <div id="sectionLibraryBody" class="section-body">

<script>
      const canvas = document.getElementById("videoCanvas");

      const audio = document.getElementById("previewAudio");
      const vocalWaveformCanvas = document.getElementById("vocalWaveform");
      const vocalWaveformRail = document.getElementById("vocalWaveformRail");
      let vocalWaveformPeaks = [];
      let vocalWaveformDuration = 0;
      let vocalWaveformContext = null;
      let vocalWaveformLoadToken = 0;
      let vocalWaveformGain = 1.6;
      let vocalWaveformWindowStart = 0;
      const vocalWaveformWindowSize = 0.4;

      let lyricLines = [];
      let bgImageObj = null;
      let selectedLrcFilename = "";

        function drawVocalWaveform() {
          if (!vocalWaveformCanvas || !vocalWaveformRail) return;
          const width = Math.max(1, Math.floor(vocalWaveformRail.clientWidth - 16));
          const height = Math.max(1, Math.floor(vocalWaveformRail.clientHeight - 10));
          const dpr = window.devicePixelRatio || 1;
          const pixelWidth = Math.floor(width * dpr);
          const pixelHeight = Math.floor(height * dpr);
          if (vocalWaveformCanvas.width !== pixelWidth || vocalWaveformCanvas.height !== pixelHeight) {
            vocalWaveformCanvas.width = pixelWidth;
            vocalWaveformCanvas.height = pixelHeight;
          }
          const waveformCtx = vocalWaveformCanvas.getContext("2d");
          waveformCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
          waveformCtx.clearRect(0, 0, width, height);
          waveformCtx.fillStyle = "#ffffff";
          waveformCtx.fillRect(0, 0, width, height);
          waveformCtx.strokeStyle = "#111111";
          waveformCtx.lineWidth = 1;
          waveformCtx.beginPath();
          waveformCtx.moveTo(0, height / 2);
          waveformCtx.lineTo(width, height / 2);
          waveformCtx.stroke();

          if (vocalWaveformPeaks.length) {
            const startIndex = Math.floor(vocalWaveformWindowStart * vocalWaveformPeaks.length);
            const endIndex = Math.max(startIndex + 1, Math.ceil((vocalWaveformWindowStart + vocalWaveformWindowSize) * vocalWaveformPeaks.length));
            const visiblePeaks = vocalWaveformPeaks.slice(startIndex, endIndex);
            waveformCtx.fillStyle = "#111111";
            const step = width / visiblePeaks.length;
            visiblePeaks.forEach((peak, index) => {
              const amplitude = Math.max(2, Math.min(height * 0.48, peak * vocalWaveformGain * (height * 0.48)));
              const barWidth = Math.max(1, step * 0.76);
              const x = index * step + ((step - barWidth) / 2);
              waveformCtx.fillRect(x, (height / 2) - amplitude, barWidth, amplitude * 2);
            });
          }

          const duration = Number.isFinite(audio.duration) && audio.duration > 0 ? audio.duration : vocalWaveformDuration;
          if (duration > 0) {
              const relativePosition = ((audio.currentTime / duration) - vocalWaveformWindowStart) / vocalWaveformWindowSize;
              if (relativePosition < 0 || relativePosition > 1) return;
              const x = Math.max(0, Math.min(width, relativePosition * width));
            waveformCtx.strokeStyle = "#d71920";
            waveformCtx.lineWidth = 2;
            waveformCtx.beginPath();
            waveformCtx.moveTo(x, 0);
            waveformCtx.lineTo(x, height);
            waveformCtx.stroke();
          }
        }

        async function loadVocalWaveform(audioFilename) {
          const token = ++vocalWaveformLoadToken;
          vocalWaveformPeaks = [];
          vocalWaveformDuration = 0;
          vocalWaveformWindowStart = 0;
          drawVocalWaveform();
          if (!audioFilename) return;
          try {
            const { res, data } = await fetchJsonSafe(`/api/vocal-waveform?audio_filename=${encodeURIComponent(audioFilename)}`, {}, "Vocal waveform API");
            if (!res.ok || token !== vocalWaveformLoadToken) return;
            const response = await fetch(data.url);
            if (!response.ok || token !== vocalWaveformLoadToken) return;
            const buffer = await response.arrayBuffer();
            if (!vocalWaveformContext) {
              vocalWaveformContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            const decoded = await vocalWaveformContext.decodeAudioData(buffer);
            if (token !== vocalWaveformLoadToken) return;
            vocalWaveformDuration = decoded.duration;
            const samples = decoded.getChannelData(0);
            const bucketCount = Math.max(240, Math.min(1600, Math.floor(vocalWaveformRail.clientWidth * 2)));
            const bucketSize = Math.max(1, Math.floor(samples.length / bucketCount));
              vocalWaveformPeaks = Array.from({ length: bucketCount }, (_, bucket) => {
              const start = bucket * bucketSize;
              const end = Math.min(samples.length, start + bucketSize);
              let peak = 0;
              for (let index = start; index < end; index += 1) peak = Math.max(peak, Math.abs(samples[index]));
              return peak;
            });
              const peakMax = Math.max(...vocalWaveformPeaks, 0.001);
              vocalWaveformPeaks = vocalWaveformPeaks.map((peak) => peak / peakMax);
            drawVocalWaveform();
          } catch (error) {
            if (token === vocalWaveformLoadToken) console.warn("Vocal waveform unavailable", error);
          }
        }

        function seekFromVocalWaveform(event) {
          if (!vocalWaveformRail) return;
          const duration = Number.isFinite(audio.duration) && audio.duration > 0 ? audio.duration : vocalWaveformDuration;
          if (!duration) return;
          const rect = vocalWaveformRail.getBoundingClientRect();
          const windowPosition = vocalWaveformWindowStart + (((event.clientX - rect.left) / rect.width) * vocalWaveformWindowSize);
          audio.currentTime = Math.max(0, Math.min(duration, windowPosition * duration));
          syncPlaybackUi();
        }

        vocalWaveformRail?.addEventListener("click", seekFromVocalWaveform);
        document.getElementById("waveformUp")?.addEventListener("click", (event) => {
          event.stopPropagation();
          vocalWaveformGain = Math.min(3.5, vocalWaveformGain + 0.25);
          drawVocalWaveform();
        });
        document.getElementById("waveformDown")?.addEventListener("click", (event) => {
          event.stopPropagation();
          vocalWaveformGain = Math.max(0.5, vocalWaveformGain - 0.25);
          drawVocalWaveform();
        });
        document.getElementById("waveformBack")?.addEventListener("click", (event) => {
          event.stopPropagation();
          vocalWaveformWindowStart = Math.max(0, vocalWaveformWindowStart - vocalWaveformWindowSize * 0.75);
          drawVocalWaveform();
        });
        document.getElementById("waveformForward")?.addEventListener("click", (event) => {
          event.stopPropagation();
          vocalWaveformWindowStart = Math.min(1 - vocalWaveformWindowSize, vocalWaveformWindowStart + vocalWaveformWindowSize * 0.75);
          drawVocalWaveform();
        });
        window.addEventListener("resize", drawVocalWaveform);
// 1. Variable to keep track of our rendering loop
      let renderLoopId = null;

      // 2. The new 60fps rendering engine
      function startRenderLoop() {
          // Prevent multiple loops from running at the same time
          if (renderLoopId) cancelAnimationFrame(renderLoopId);

          function loop() {
              // This calls your existing canvas drawing function
              // It will now run up to 60 times a second!
              updatePreview();
              drawVocalWaveform();

              // Request the next frame
              renderLoopId = requestAnimationFrame(loop);
          }

          // Kick off the first frame
          loop();
      }

      function stopRenderLoop() {
          if (renderLoopId) {
              cancelAnimationFrame(renderLoopId);
              renderLoopId = null;
          }
      }

      // 3. Automatically start/stop the loop based on audio state
      const previewAudio = document.getElementById('previewAudio');

      if (previewAudio) {
          // When the music plays, start the high-speed loop
          previewAudio.addEventListener('play', startRenderLoop);

          // When the music pauses or ends, stop the loop to save CPU
          previewAudio.addEventListener('pause', stopRenderLoop);
          previewAudio.addEventListener('ended', stopRenderLoop);

          // If the user drags the timeline/seeks while paused, force a single frame update
          previewAudio.addEventListener('seeking', () => {
              syncPlaybackUi();
            });
            previewAudio.addEventListener('timeupdate', syncPlaybackUi);
            previewAudio.addEventListener('error', () => {
              const source = previewAudio.currentSrc || previewAudio.src || "(empty source)";
              pushFrontendDebugIssue({
                message: `Preview audio could not be played: ${source}`,
                file: "previewAudio",
                trace: previewAudio.error ? `Media error code ${previewAudio.error.code}` : "",
              });
          });
      }

      // 4. Update the Play/Pause button logic
      function togglePlayback() {
          if (!previewAudio) return;

          if (previewAudio.paused) {
              if (!previewAudio.src) {
                setStatus("Select a media file before pressing Play.", true);
                return;
              }
              previewAudio.play().catch((error) => {
                setStatus("Preview audio could not be played. Check that the source file is available.", true);
                pushFrontendDebugIssue({ message: error.message || "Preview audio playback failed", file: "previewAudio", trace: error.stack || "" });
              });
          } else {
              previewAudio.pause();
          }
      }

      const playButton = document.getElementById('playBtn');
      if (previewAudio) {
          previewAudio.addEventListener('play', () => {
              if (playButton) playButton.textContent = 'Pause';
          });

          previewAudio.addEventListener('pause', () => {
              if (playButton) playButton.textContent = 'Play';
          });
      }

      function _hexToRgbSafe(color) {
        const raw = String(color || "").trim();
        const m = raw.match(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/);
        if (!m) return null;
        let hex = m[1];
        if (hex.length === 3) hex = hex.split("").map((c) => c + c).join("");
        return {
          r: parseInt(hex.slice(0, 2), 16),
          g: parseInt(hex.slice(2, 4), 16),
          b: parseInt(hex.slice(4, 6), 16),
        };
      }

      function _rgbToHex(rgb) {
        const ch = (v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0");
        return `#${ch(rgb.r)}${ch(rgb.g)}${ch(rgb.b)}`;
      }

      function _mixHex(c1, c2, t = 0.5) {
        const a = _hexToRgbSafe(c1) || { r: 17, g: 24, b: 33 };
        const b = _hexToRgbSafe(c2) || { r: 255, g: 255, b: 255 };
        const k = Math.max(0, Math.min(1, Number(t) || 0));
        return _rgbToHex({
          r: a.r + ((b.r - a.r) * k),
          g: a.g + ((b.g - a.g) * k),
          b: a.b + ((b.b - a.b) * k),
        });
      }

      function _relativeLuminance(hex) {
        const rgb = _hexToRgbSafe(hex) || { r: 0, g: 0, b: 0 };
        const toLinear = (v) => {
          const c = v / 255;
          return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        };
        const r = toLinear(rgb.r);
        const g = toLinear(rgb.g);
        const b = toLinear(rgb.b);
        return (0.2126 * r) + (0.7152 * g) + (0.0722 * b);
      }

      function _contrastRatio(a, b) {
        const l1 = _relativeLuminance(a);
        const l2 = _relativeLuminance(b);
        const hi = Math.max(l1, l2);
        const lo = Math.min(l1, l2);
        return (hi + 0.05) / (lo + 0.05);
      }

      function _pickReadableText(bgHex, candidates) {
        const picks = (candidates || []).filter(Boolean);
        if (picks.length === 0) return "#ffffff";
        picks.sort((x, y) => _contrastRatio(y, bgHex) - _contrastRatio(x, bgHex));
        return picks[0];
      }

      function applyControlContrastVars() {
        const root = document.documentElement;
        const styles = getComputedStyle(root);
        const bgBase = (styles.getPropertyValue("--bg-base") || "#0b0c10").trim();
        const bgSurface = (styles.getPropertyValue("--bg-surface") || "#1f2833").trim();
        const accent = (styles.getPropertyValue("--accent") || "#45f3ff").trim();
        const accentHover = (styles.getPropertyValue("--accent-hover") || accent).trim();
        const textMain = (styles.getPropertyValue("--text-main") || "#c5c6c7").trim();

        const controlBg = _mixHex(bgSurface, bgBase, 0.55);
        const controlFg = _pickReadableText(controlBg, [textMain, "#ffffff", "#f8f8f8", "#111111", "#000000"]);
        const buttonBg = accent;
        const buttonFg = _pickReadableText(buttonBg, ["#111111", "#000000", "#ffffff", textMain]);
        const buttonHoverBg = _contrastRatio(accentHover, buttonFg) >= 4.5 ? accentHover : _mixHex(accentHover, bgSurface, 0.2);
        const labelColor = _contrastRatio(accentHover, bgSurface) >= 3.2 ? accentHover : _pickReadableText(bgSurface, [accent, "#ffffff", textMain]);
        const controlBorder = _mixHex(accent, bgSurface, 0.35);
        const buttonSmallFg = _pickReadableText(bgSurface, [textMain, "#ffffff", accentHover]);

        root.style.setProperty("--label-color", labelColor);
        root.style.setProperty("--control-bg", controlBg);
        root.style.setProperty("--control-fg", controlFg);
        root.style.setProperty("--control-border", controlBorder);
        root.style.setProperty("--button-bg", buttonBg);
        root.style.setProperty("--button-fg", buttonFg);
        root.style.setProperty("--button-hover-bg", buttonHoverBg);
        root.style.setProperty("--button-small-fg", buttonSmallFg);
      }

      function ensureKaraokePlaceholderImage() {
        if (karaokePlaceholderImg) return karaokePlaceholderImg;
        const svg = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f005c"/>
      <stop offset="35%" stop-color="#5b2c83"/>
      <stop offset="65%" stop-color="#ff6b6b"/>

    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="55%">

      function getLyricsRevisionHistory(audioFilename) {
        if (!audioFilename) return [];
        if (!lyricsRevisionHistoryByAudio[audioFilename]) lyricsRevisionHistoryByAudio[audioFilename] = [];
        return lyricsRevisionHistoryByAudio[audioFilename];
      }

      function addLyricsRevision(audioFilename, content, reason = "commit") {
        if (!audioFilename) return;
        const text = String(content || "");
        const history = getLyricsRevisionHistory(audioFilename);
        const last = history.length ? history[history.length - 1] : null;
        if (last && last.content === text) return;
        history.push({ content: text, reason, at: Date.now() });
        lyricsRevisionCursorByAudio[audioFilename] = Math.max(0, history.length - 1);
      }

      function ensureLyricsRevisionSeed(content, reason = "seed") {
        if (!selectedAudioFilename) return;
        const history = getLyricsRevisionHistory(selectedAudioFilename);
        if (history.length === 0) addLyricsRevision(selectedAudioFilename, content, reason);
      }

      function formatRevisionLabel(entry) {
        const dt = new Date(entry.at || Date.now());
        return `${dt.toLocaleString()} (${entry.reason || "commit"})`;
      }

      function _getRevisionCursor(audioFilename) {
        const history = getLyricsRevisionHistory(audioFilename);
        if (history.length === 0) return -1;
        let idx = Number(lyricsRevisionCursorByAudio[audioFilename]);
        if (!Number.isFinite(idx)) idx = history.length - 1;
        idx = Math.max(0, Math.min(history.length - 1, idx));
        lyricsRevisionCursorByAudio[audioFilename] = idx;
        return idx;
      }

      function _loadLyricsRevisionByIndex(audioFilename, idx) {
        const history = getLyricsRevisionHistory(audioFilename);
        if (history.length === 0) return false;
        const clamped = Math.max(0, Math.min(history.length - 1, Number(idx) || 0));
        const target = history[clamped];
        lyricsRevisionCursorByAudio[audioFilename] = clamped;
        document.getElementById("lyricsEditor").value = target.content || "";
        parseLrcData(target.content || "");
        manualTimingState.previewFromAppliedLyrics = true;
        persistManualTiming();
        updateManualTimingHud();
        updatePreview();
        const pos = clamped + 1;
        setStatus(`Revision ${pos}/${history.length} loaded: ${formatRevisionLabel(target)}. Press Commit Lyrics to save it.`);
        return true;
      }

      function stepLyricsRevision(delta) {
        if (!selectedAudioFilename) { setStatus("Select a project first.", true); return; }
        const history = getLyricsRevisionHistory(selectedAudioFilename);
        if (history.length < 2) {
          setStatus("No additional committed revisions yet.", true);
          return;
        }
        const cursor = _getRevisionCursor(selectedAudioFilename);
        const next = cursor + Number(delta || 0);
        if (next < 0 || next >= history.length) {
          setStatus(next < 0 ? "Already at oldest revision." : "Already at newest revision.");
          return;
        }
        _loadLyricsRevisionByIndex(selectedAudioFilename, next);
      }

      async function revertLyricsRevision() {
        if (!selectedAudioFilename) { setStatus("Select a project first.", true); return; }
        const history = getLyricsRevisionHistory(selectedAudioFilename);
        if (history.length < 2) {
          setStatus("No earlier committed revisions yet.", true);
          return;
        }
        // Keep center button as "step backward once" for quick revert behavior.
        stepLyricsRevision(-1);
      }

      function formatDebugIssue(issue) {
        const file = issue.file || "(no file)";
        const line = issue.line || 0;
        const column = issue.column || 0;
        const where = line ? `${file}:${line}${column ? `:${column}` : ""}` : file;
        const parts = [`[${(issue.kind || "issue").toUpperCase()}] ${issue.message || "Unknown issue"}`, where];
        if (issue.code) parts.push(issue.code);
        if (issue.pointer) parts.push(issue.pointer);
        if (issue.trace) parts.push(issue.trace);
        return parts.join("\n");
      }

      function pushFrontendDebugIssue(issue) {
        if (!issue) return;
        frontendDebugIssues.unshift({
          kind: "frontend",
          severity: issue.severity || "error",
          message: issue.message || "Unknown frontend issue",
          file: issue.file || (issue.sourceURL || "index.html"),
          line: Number(issue.line || 0),
          column: Number(issue.column || 0),
          code: issue.code || "",
          trace: issue.trace || "",
          at: Date.now(),
        });
        frontendDebugIssues = frontendDebugIssues.slice(0, 20);
      }

      window.addEventListener("error", (event) => {
        pushFrontendDebugIssue({
          message: event.message || "Unhandled frontend error",
          file: event.filename || "index.html",
          line: event.lineno || 0,
          column: event.colno || 0,
          trace: event.error && event.error.stack ? String(event.error.stack) : "",
        });
      });

      window.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason;
        pushFrontendDebugIssue({
          message: reason && reason.message ? reason.message : `Unhandled rejection: ${String(reason)}`,
          file: "browser-promise",
          trace: reason && reason.stack ? String(reason.stack) : "",
        });
      });

      async function runDebugger() {

          const syntaxIssues = data.syntax_issues || [];
          const runtimeIssues = data.runtime_issues || [];
          const frontendIssues = frontendDebugIssues.slice();
          summaryEl.textContent = `Syntax issues: ${syntaxIssues.length} | Runtime issues: ${runtimeIssues.length} | Frontend issues: ${frontendIssues.length}`;
          const allIssues = [...frontendIssues, ...runtimeIssues, ...syntaxIssues];
          lastDebugReportText = allIssues.length
            ? allIssues.map(formatDebugIssue).join("\n\n------------------------------\n\n")

        } catch (err) {

      let controlStepTimer = null;
      let controlStepState = null;

      function startControlStep(id, direction, min, max, displayId, event) {
        event?.preventDefault();
        stopControlStep();
        const apply = () => {
          const input = document.getElementById(id);
          const display = document.getElementById(displayId);
          if (!input || !display) return;
          const value = Math.max(min, Math.min(max, Number(input.value || 0) + direction));
          input.value = value;
          display.value = value;
          updatePreview();
        };
        apply();
        const startedAt = performance.now();
        controlStepState = { apply, startedAt, direction };
        controlStepTimer = window.setInterval(() => {
          const elapsed = performance.now() - startedAt;
          const repeats = elapsed > 3000 ? 8 : elapsed > 1800 ? 4 : elapsed > 800 ? 2 : 1;
          for (let index = 0; index < repeats; index += 1) apply();
        }, 100);
      }

      function stopControlStep(event) {
        event?.preventDefault();
        if (controlStepTimer) window.clearInterval(controlStepTimer);
        controlStepTimer = null;
        controlStepState = null;
      }

      function enablePanelDragging() {
        // Cards reorder (push siblings aside) within their own container instead of free-floating and overlapping.
        // Only the title bar starts a drag; the native corner handle stays dedicated to resizing, and a plain
        // click on the title bar still toggles the section since drag only engages past a movement threshold.
        const groups = [
          Array.from(document.querySelectorAll(".app-layout > .card")),
          Array.from(document.querySelectorAll(".top-panels > .card")),
        ];
        const dragThreshold = 6;

        groups.forEach((group) => {
          group.forEach((panel) => {
            const handle = panel.querySelector(":scope > .section-toggle");
            if (!handle) return;
            handle.addEventListener("click", (event) => {
              if (handle.dataset.justDragged === "1") {
                delete handle.dataset.justDragged;
                event.preventDefault();
                event.stopImmediatePropagation();
              }
            }, true);
            handle.addEventListener("pointerdown", (event) => {
              if (event.button !== 0) return;
              const container = panel.parentElement;
              const siblings = Array.from(container.children).filter((el) => el !== panel && el.classList.contains("card"));
              const startRect = panel.getBoundingClientRect();
              const pointerOffsetX = event.clientX - startRect.left;
              const pointerOffsetY = event.clientY - startRect.top;
              const startX = event.clientX;
              const startY = event.clientY;
              let dragging = false;
              let lastTarget = null;

              const beginDrag = () => {
                dragging = true;
                handle.setPointerCapture(event.pointerId);
                document.body.classList.add("panel-drag-active");
                panel.classList.add("panel-dragging");
                panel.style.position = "fixed";
                panel.style.left = `${startRect.left}px`;
                panel.style.top = `${startRect.top}px`;
                panel.style.width = `${startRect.width}px`;
              };

              const move = (moveEvent) => {
                if (!dragging) {
                  if (Math.hypot(moveEvent.clientX - startX, moveEvent.clientY - startY) < dragThreshold) return;
                  moveEvent.preventDefault();
                  beginDrag();
                }
                panel.style.left = `${moveEvent.clientX - pointerOffsetX}px`;
                panel.style.top = `${moveEvent.clientY - pointerOffsetY}px`;

                let closestSibling = null;
                let closestDist = Infinity;
                siblings.forEach((sibling) => {
                  const rect = sibling.getBoundingClientRect();
                  const dist = Math.hypot(
                    (rect.left + rect.width / 2) - moveEvent.clientX,
                    (rect.top + rect.height / 2) - moveEvent.clientY,
                  );
                  if (dist < closestDist) { closestDist = dist; closestSibling = { sibling, rect }; }
                });
                if (lastTarget) lastTarget.classList.remove("panel-drop-target");
                if (closestSibling) {
                  const { sibling, rect } = closestSibling;
                  sibling.classList.add("panel-drop-target");
                  lastTarget = sibling;
                  const placeBefore = moveEvent.clientY < rect.top + (rect.height / 2);
                  container.insertBefore(panel, placeBefore ? sibling : sibling.nextSibling);
                }
              };

              const stop = () => {
                handle.releasePointerCapture?.(event.pointerId);
                window.removeEventListener("pointermove", move);
                window.removeEventListener("pointerup", stop);
                window.removeEventListener("pointercancel", stop);
                document.body.classList.remove("panel-drag-active");
                if (lastTarget) lastTarget.classList.remove("panel-drop-target");
                if (dragging) {
                  handle.dataset.justDragged = "1";
                  panel.classList.remove("panel-dragging");
                  panel.style.position = "";
                  panel.style.left = "";
                  panel.style.top = "";
                  panel.style.width = "";
                }
              };

              window.addEventListener("pointermove", move);
              window.addEventListener("pointerup", stop);
              window.addEventListener("pointercancel", stop);
            });
          });
        });
      }

      function formatLrcTime(seconds) {
        const safe = Math.max(0, Number(seconds || 0));
        const mins = Math.floor(safe / 60);
        const secs = safe - mins * 60;
        return `${String(mins).padStart(2, "0")}:${secs.toFixed(2).padStart(5, "0")}`;
      }

      function extractWordsFromEditor() {
        const editorText = document.getElementById("lyricsEditor").value || "";
        const stripped = editorText.replace(/\[(\d+):(\d+)(?:\.(\d{1,3}))?\]/g, " ");
        return stripped.match(/\S+/g) || [];
      }

      function buildTimedWordEntriesFromLyrics() {
        const entries = [];
        lyricLines.forEach((item, idx) => {
          const nextTime = lyricLines[idx + 1] ? lyricLines[idx + 1].time : item.time + 3.0;
          const words = (item.text || "").split(" ").filter(Boolean);
          if (!words.length) return;
          const perWord = Math.max(0.02, (nextTime - item.time) / words.length);
          words.forEach((word, wordIdx) => {
            const start = item.time + (wordIdx * perWord);
            entries.push({
              word,
              start,
              end: start + perWord,
            });
          });
        });
        return entries;
      }

      function findManualCursorIndexAtTime(nowSec) {
        const entries = manualTimingState.entries || [];
        const validEntries = entries.filter((entry) => entry && Number.isFinite(entry.start));
        if (!validEntries.length) return -1;

        for (let i = 0; i < entries.length; i += 1) {
          const entry = entries[i];
          if (!entry || !Number.isFinite(entry.start)) continue;
          const end = Number.isFinite(entry.end) ? entry.end : (entry.start + 0.3);
          if (nowSec >= entry.start && nowSec < end) return i;
          if (nowSec < entry.start) return i;
        }
        const lastValidIndex = entries.reduce((last, entry, index) => Number.isFinite(entry?.start) ? index : last, -1);
        return lastValidIndex === entries.length - 1 ? lastValidIndex : -1;
      }

      function alignManualTimingToCurrentPlayback() {
        const now = Number(audio.currentTime || 0);
        const totalWords = manualTimingState.words.length;
        if (totalWords === 0) {
          manualTimingState.cursor = 0;
          manualTimingState.activeStart = null;
          return;
        }

        let cursor = findManualCursorIndexAtTime(now);
        if (cursor < 0) {
          cursor = getPlaybackWordIndexAtTime(now, true);
        }
        if (cursor < 0) {
          const dur = Number.isFinite(audio.duration) ? audio.duration : 0;
          if (dur > 0) {
            const ratio = Math.max(0, Math.min(1, now / dur));
            cursor = Math.min(totalWords - 1, Math.floor(ratio * totalWords));
          } else {
            cursor = Math.min(totalWords - 1, cursor);
          }
        }
        manualTimingState.cursor = Math.max(0, Math.min(totalWords - 1, cursor));
        manualTimingState.activeStart = null;
      }

          await fetch("/api/save-project-state", { method: "POST", body: fd });
